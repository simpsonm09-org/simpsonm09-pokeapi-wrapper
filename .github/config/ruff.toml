line-length = 100
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI marks Depends, Query, and Path as immutable call defaults, so B008 is a
# false positive on the route signatures.
[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
