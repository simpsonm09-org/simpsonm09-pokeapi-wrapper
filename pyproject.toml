[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokeapi-wrapper"
version = "0.1.0"
description = "A FastAPI service that wraps the public PokeAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.scripts]
pokeapi-wrapper = "pokeapi_wrapper.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/pokeapi_wrapper"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
